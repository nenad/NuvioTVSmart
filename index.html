<!doctype html>
<html lang="en" class="no-flex-gap no-css-grid no-css-math no-backdrop-filter no-aspect-ratio">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="assets/runtime/legacy-features.js"></script>
    <script>
      (function configureTizenLaunch() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;
        var search = String((window.location && window.location.search) || "").toLowerCase();
        var userAgent = String(
          (window.navigator && window.navigator.userAgent) || ""
        ).toLowerCase();
        var webapis = root.webapis || {};
        var isTizenLaunch = Boolean(
          root.__NUVIO_PLATFORM__ === "tizen" ||
          root.tizen ||
          root.avplay ||
          webapis.avplay ||
          webapis.avPlay ||
          webapis.productinfo ||
          search.indexOf("wrapper=tizen") !== -1 ||
          userAgent.indexOf("tizen") !== -1
        );

        if (!isTizenLaunch) {
          return;
        }

        root.__NUVIO_PLATFORM__ = "tizen";
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }
        viewport.setAttribute(
          "content",
          "width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        );
      })();
    </script>
    <script>
      (function configureTouchCanvas() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;

        // TVs size their own canvas: Tizen above, webOS natively.
        if (root.__NUVIO_PLATFORM__ === "tizen" || root.webOS || root.PalmSystem) {
          return;
        }
        if (!root.matchMedia || !root.matchMedia("(pointer: coarse)").matches) {
          return;
        }

        // The stylesheet is drawn in TV pixels, which are Android TV dp
        // doubled for a 1920px canvas. On phones and tablets one dp is about
        // one CSS pixel, so a layout viewport twice the device width gives
        // every control, label and poster its Android size. A phone held
        // sideways then gets roughly the TV canvas itself.
        var landscape = root.matchMedia("(orientation: landscape)");
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }

        function apply() {
          var screenRef = root.screen || {};
          var a = Number(screenRef.width || 0);
          var b = Number(screenRef.height || 0);
          if (!a || !b) {
            return;
          }
          // iOS reports portrait dimensions in either orientation.
          var deviceWidth = landscape.matches ? Math.max(a, b) : Math.min(a, b);
          // Pin the scale too: without it, browsers zoom in on a focused text
          // field and keep that zoom, cropping the canvas until reload, and
          // past it. iOS still lets the viewer pinch to zoom.
          var scale = "initial-scale=0.5, minimum-scale=0.5, maximum-scale=0.5, user-scalable=no";
          // Sideways, the TV layout runs edge to edge and knows nothing of a
          // notch or Dynamic Island, so keep it inside the safe area: no
          // viewport-fit=cover, and a width the browser derives from the
          // scale and that area. Upright, the compact layout pads for the
          // insets itself.
          viewport.setAttribute(
            "content",
            landscape.matches
              ? scale
              : "width=" + Math.round(deviceWidth * 2) + ", " + scale + ", viewport-fit=cover"
          );
        }

        apply();
        if (typeof landscape.addEventListener === "function") {
          landscape.addEventListener("change", apply);
        } else if (typeof landscape.addListener === "function") {
          landscape.addListener(apply);
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Installing to a phone's home screen: name, icon and a status bar
         that the page starts below, so no screen needs a top inset. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nuvio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="manifest" href="assets/web/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/web/icon-180.png" />
    <title>Nuvio TV</title>

    <link rel="stylesheet" href="css/base.css?v=20260509s" />
    <link rel="stylesheet" href="css/layout.css?v=20260509s" />
    <link rel="stylesheet" href="css/components.css?v=20260531supporters2" />
    <link rel="stylesheet" href="css/themes.css?v=20260509s" />
  </head>
  <body>
    <script src="boot-guard.js"></script>
    <!-- Tizen fast path: deferred scripts keep document order but no longer
         parser-block first paint / focus-engine init on single-core TVs. -->
    <script
      defer
      src="core-js.bundle.js"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
    <script defer src="nuvio.env.js"></script>

    <script defer src="assets/libs/qrcode-generator.js"></script>

    <script
      defer
      src="app.bundle.js?v=20260531supporters2"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
  </body>
</html>
